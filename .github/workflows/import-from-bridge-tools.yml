name: Import non-Bridge prototypes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Clone source repository
        run: git clone --depth 1 https://github.com/clementsouchier-stack/bridge-tools.git /tmp/bridge-tools

      - name: Build target structure
        run: |
          set -e
          SRC=/tmp/bridge-tools/not-bridge

          rm -rf karim-tiza act-in-synch
          cp -a "$SRC/karim-tiza" ./karim-tiza
          cp -a "$SRC/act-in-synch" ./act-in-synch
          touch .nojekyll

      - name: Commit imported structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import organized non-Bridge prototypes"
          git push
